[router]
redis_url = "redis://192.168.120.3:6379/0"
listen = "0.0.0.0:8088"
gtfs_path = "https://www.vgn.de/opendata/GTFS.zip"
product_map = "config/product-map.toml"
stop_overrides = "config/stop-overrides.csv"
default_transfer_seconds = 120
horizon_seconds = 129600
day_cache_capacity = 8
stats_history_cache_capacity = 8
reload_seconds = 60
min_samples = 20
walking_speed_mps = 1.3
# For an entirely offline API, set local_gtfs and optionally local_stats.
# local_gtfs = "data/gtfs.snapshot"
# local_stats = "data/stats.snapshot"

[history]
url = "http://192.168.120.3:8123"
database = "vag_stats"
user = "vag_stats"
delay_unit = "seconds"
timezone = "Europe/Berlin"
min_samples = 20
primary_days = 30
fallback_days = 90
recent_days = 7
recent_weight = 4
timeout_seconds = 1200
# Explicit dates for the applicable regional holiday calendar, including history.
holidays = []

[reliability]
delay_warning_probability = 0.50
delay_warning_seconds = 300
transfer_warning_probability = 0.85
transfer_critical_probability = 0.65
cancellation_warning_probability = 0.03
minimum_samples = 20
