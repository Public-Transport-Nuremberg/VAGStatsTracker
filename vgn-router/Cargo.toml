[workspace]
resolver = "2"
members = ["crates/router-model", "crates/gtfs", "crates/history", "crates/snapshot", "crates/csa", "crates/reliability", "apps/router-builder", "apps/router-api"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-big-array = "0.5"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
redis = { version = "0.32", features = ["tokio-comp"] }
clickhouse = "0.13"
csv = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
arc-swap = "1"
hashbrown = { version = "0.15", features = ["serde"] }
rstar = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus = "0.14"
sha2 = "0.10"
zstd = "0.13"
bincode = "1.3"
toml = "0.8"
unicode-normalization = "0.1"
parking_lot = "0.12"
futures-util = "0.3"
url = "2"
router-model = { path = "crates/router-model" }
gtfs = { path = "crates/gtfs" }
history = { path = "crates/history" }
snapshot = { path = "crates/snapshot" }
csa = { path = "crates/csa" }
reliability = { path = "crates/reliability" }

[profile.release]
lto = "thin"
codegen-units = 1
