[package]
name = "history"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-big-array = "0.5"
toml = "0.8"
unicode-normalization = "0.1"
chrono-tz = "0.10"
futures-util = "0.3"
bincode = "1.3"
zstd = "0.13"
tracing = "0.1"

[dev-dependencies]
tokio = { version="1", features=["macros","rt"] }
