name: Release VGN router

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example, vgn-router-v0.1.0)
        required: true
        type: string
      prerelease:
        description: Mark the release as a prerelease
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: vgn-router

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select stable Rust
        run: rustup default stable

      - name: Build router binaries
        run: |
          cargo build --release --locked -p router-api --bin router-api
          cargo build --release --locked -p router-builder --bin router-builder

      - name: Package binaries
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          package="vgn-router-linux-${ARCH}"
          mkdir -p "dist/${package}"
          install -m 755 target/release/router-api "dist/${package}/router-api"
          install -m 755 target/release/router-builder "dist/${package}/router-builder"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vgn-router-linux-${{ matrix.arch }}
          path: vgn-router/dist/vgn-router-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: vgn-router-linux-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: sha256sum dist/*.tar.gz > dist/SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            args=(
              "$RELEASE_TAG"
              dist/*
              --repo "$GITHUB_REPOSITORY"
              --target "$GITHUB_SHA"
              --title "$RELEASE_TAG"
              --generate-notes
            )
            if [[ "$PRERELEASE" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh release create "${args[@]}"
          fi
