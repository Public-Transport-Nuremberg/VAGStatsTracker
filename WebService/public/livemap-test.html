<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Live map bounding-box test</title>
    <link rel="stylesheet" href="/dist/css/ol.css" />
    <script src="/dist/js/ol.js"></script>
    <style>
      html, body, #map { width: 100%; height: 100%; margin: 0; }
      body { font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
      #panel, #details {
        position: fixed; z-index: 10; left: 12px; max-width: min(620px, calc(100vw - 24px));
        box-sizing: border-box; border: 1px solid #bbb; border-radius: 6px;
        background: rgba(255, 255, 255, .94); box-shadow: 0 2px 10px #0003;
      }
      #panel { top: 12px; padding: 9px 11px; }
      #details { bottom: 12px; max-height: 38vh; overflow: auto; padding: 8px; display: none; }
      #details pre { margin: 0; white-space: pre-wrap; word-break: break-word; font-size: 11px; }
      #url { display: block; margin-top: 4px; color: #555; font: 11px/1.3 monospace; word-break: break-all; }
      button { cursor: pointer; }
      .ok { color: #08752d; }
      .error { color: #b00020; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="panel">
      <strong>/live/map bounding-box prototype</strong>
      <button id="refresh" type="button">Refresh</button>
      <span id="status">Move the map to query...</span>
      <code id="url"></code>
      <div>Green = EstimatedGPS, orange = stop fallback. Click a marker for JSON.</div>
    </div>
    <div id="details"><pre id="json"></pre></div>
    <script src="/dist/js/livemap_test.js"></script>
  </body>
</html>
